<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:fit-content;height:fit-content;background:transparent}
.fig,.fig *{font-family:"Segoe UI","Helvetica Neue",Arial,"Microsoft YaHei","Noto Sans SC",sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;box-sizing:border-box;font-style:normal!important}
.fig{width:fit-content;padding:20px 24px;background:transparent;
  --line:#000;--txt:#000;--ac:hsl(224,46%,42%);--acbg:hsl(224,42%,95%)}
.col{display:flex;flex-direction:column;align-items:center;gap:0;width:510px}
.n{background:#fff;border:1px solid var(--line);border-radius:5px;padding:8px 12px;color:var(--txt);
  text-align:center;display:flex;flex-direction:column;gap:2px;width:100%;justify-content:center}
.n .ttl{font-size:13px;font-weight:600;line-height:1.3}
.n .sub{font-size:12px;font-weight:400;line-height:1.3;letter-spacing:.02em}
.cap{border-radius:999px;background:var(--acbg);border:1.4px solid var(--ac)}
.cap .ttl{color:var(--ac);font-weight:700}
.arw{display:flex;flex-direction:column;align-items:center}
.arw .ln{width:1.4px;height:16px;background:var(--line)}
.arw .tp{width:0;height:0;border-top:7px solid var(--line);border-left:5px solid transparent;border-right:5px solid transparent}
.par{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:510px}
.par .n{width:100%}
.split{display:flex;flex-direction:column;align-items:center}
.split .fan{width:302px;height:14px;border-bottom:1.4px solid var(--line);border-left:1.4px solid var(--line);border-right:1.4px solid var(--line);border-radius:0 0 6px 6px}
.merge .fan{width:302px;height:14px;border-top:1.4px solid var(--line);border-left:1.4px solid var(--line);border-right:1.4px solid var(--line);border-radius:6px 6px 0 0}
.dcol{display:flex;flex-direction:column;align-items:center}
</style></head>
<body>
<div class="fig" data-mh-palette="modern">
  <div class="col">
    <div class="n cap" data-mh-col="1"><span class="ttl">读入附件 1 环境量</span><span class="sub">构造 T∞(t)、C∞(t) 并向前延拓</span></div>
    <div class="arw" data-mh-col="1"><div class="ln"></div><div class="tp"></div></div>
    <div class="n" data-mh-col="1"><span class="ttl">装配附录 2 常物性</span><span class="sub">ρ, c_p, k 取常数；D(C)=7×10⁻⁹·e^(−0.89/C)</span></div>
    <div class="arw" data-mh-col="1"><div class="ln"></div><div class="tp"></div></div>
    <div class="split"><div class="arw"><div class="ln"></div></div><div class="fan" style="width:382px"></div></div>
    <div class="par">
      <div class="dcol"><div class="arw"><div class="ln"></div><div class="tp"></div></div>
        <div class="n"><span class="ttl">解能量方程</span><span class="sub">线性常系数，α=1.69×10⁻⁷；得 T(r,t)</span></div></div>
      <div class="dcol"><div class="arw"><div class="ln"></div><div class="tp"></div></div>
        <div class="n"><span class="ttl">解质量方程</span><span class="sub">D(C) 非线性扩散；得 C(r,t)</span></div></div>
    </div>
    <div class="merge split"><div class="fan" style="width:382px"></div><div class="arw"><div class="ln"></div><div class="tp"></div></div></div>
    <div class="n" data-mh-col="1"><span class="ttl">同一内核同一时间循环推进至 1800 s</span><span class="sub">两场解耦但共用问题 2–4 的代码路径</span></div>
    <div class="arw" data-mh-col="1"><div class="ln"></div><div class="tp"></div></div>
    <div class="n" data-mh-col="1"><span class="ttl">按题面网格采样</span><span class="sub">非等间隔时刻 × {0,0.5,1,1.5,2} cm，得表 1、表 2</span></div>
    <div class="arw" data-mh-col="1"><div class="ln"></div><div class="tp"></div></div>
    <div class="n cap" data-mh-col="1"><span class="ttl">导出温度与水分双工作表</span></div>
  </div>
</div>
</body></html>
